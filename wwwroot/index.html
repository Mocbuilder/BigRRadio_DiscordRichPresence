<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big R Radio</title>
</head>
<body>
  <h3>⚡ 80s Metal FM ⚡</h3>

  <div class="card">
    <div class="song" id="song">Connecting...</div>
    <div class="artist" id="artist">Please wait...</div>
  </div>

  <div class="controls">
    <button id="playBtn" onclick="togglePlay()">Pause</button>
    <div class="volume-container">
      <span>Volume</span>
      <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)">
    </div>
  </div>

  <script>
    let isPlaying = true;

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').innerText = isPlaying ? "Pause" : "Play";
      window.external.sendMessage('toggle');
    }

    function setVolume(val) {
      window.external.sendMessage('vol:' + val);
    }

    window.external.receiveMessage(rawJson => {
      const data = JSON.parse(rawJson);
      document.getElementById('song').innerText = data.song;
      document.getElementById('artist').innerText = "by " + data.artist;
    });
  </script>
</body>
</html>
