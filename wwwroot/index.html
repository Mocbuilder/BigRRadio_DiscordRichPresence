<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./res/css/index.css">
  <script type="module" src="./res/js/index.js"></script>
  <title>Big R Radio</title>
</head>
<body>
  <main class="app">
    <select id="RadioList"></select>
    <img id="Headline" src="./img/icon_fallback.png" alt="Headline" />
    <img id="Art" src="./res/img/blankart.png"  alt="Cover Image">
      <div class="songInfoContainer">
        <p id="Title">Connecting...</p>
        <p id="Artist">Please wait...</p>
      </div>
      <button id="PlayButton" class="iconBtn">
          <svg id="PlayIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
      </button>
    <input id="VolumeSlider" type="range" min="0" max="100" value="100">
  </main>
</body>
</html>
