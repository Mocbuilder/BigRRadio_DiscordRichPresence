<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h3 { color: #f5c2e7; margin-bottom: 12px; font-size: 1.1rem; }
        .card {
            background: #313244;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .song { font-size: 0.95rem; font-weight: bold; color: #f38ba8; margin-bottom: 4px; }
        .artist { font-size: 0.85rem; color: #a6adc8; }
        .controls {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
        }
        button {
            background: #89b4fa;
            border: none;
            color: #11111b;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #b4befe; }
        .volume-container { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
        input[type=range] { accent-color: #89b4fa; cursor: pointer; }
    </style>
</head>
<body>

    <h3>⚡ 80s Metal FM ⚡</h3>

    <div class="card">
        <div class="song" id="song">Connecting...</div>
        <div class="artist" id="artist">Please wait...</div>
    </div>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">Pause</button>
        <div class="volume-container">
            <span>Vol</span>
            <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)">
        </div>
    </div>

    <script>
        let isPlaying = true;

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "Pause" : "Play";
            window.external.sendMessage('toggle');
        }

        function setVolume(val) {
            window.external.sendMessage('vol:' + val);
        }

        // Receive JSON messages sent from C# (window.SendWebMessage)
        window.external.receiveMessage(rawJson => {
            const data = JSON.parse(rawJson);
            document.getElementById('song').innerText = data.song;
            document.getElementById('artist').innerText = "by " + data.artist;
        });
    </script>
</body>
</html>
